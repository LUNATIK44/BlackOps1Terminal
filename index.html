<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GKN OPERATING SYSTEM - TERMINAL</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --crt-green: #00ff66;
      --crt-bg: #050b05;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--crt-bg);
      color: var(--crt-green);
      font-family: 'VT323', monospace;
      font-size: 1.4rem;
      padding: 2rem;
      text-shadow: 0 0 5px rgba(0, 255, 102, 0.7);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Scanlines Overlay */
    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
    }

    .terminal-header {
      margin-bottom: 1.5rem;
      border-bottom: 2px solid var(--crt-green);
      padding-bottom: 0.5rem;
    }

    .output-line {
      margin-bottom: 0.3rem;
      white-space: pre-wrap;
    }

    .input-line {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .prompt {
      white-space: nowrap;
    }

    input[type="text"], textarea {
      background: rgba(0, 255, 102, 0.05);
      border: 1px solid var(--crt-green);
      color: var(--crt-green);
      font-family: 'VT323', monospace;
      font-size: 1.4rem;
      outline: none;
      padding: 4px 8px;
      text-shadow: 0 0 5px rgba(0, 255, 102, 0.7);
    }

    input[type="text"] {
      flex-grow: 1;
    }

    textarea {
      width: 100%;
      height: 220px;
      margin-top: 10px;
      resize: vertical;
    }

    .btn {
      background: var(--crt-green);
      color: #050b05;
      font-family: 'VT323', monospace;
      font-size: 1.2rem;
      font-weight: bold;
      padding: 4px 12px;
      border: none;
      cursor: pointer;
      text-shadow: none;
    }

    .btn:hover {
      background: #ffffff;
    }
  </style>
</head>
<body>

  <div class="terminal-header">
    <p>LOGON: MASON, A.</p>
    <p>SYSTEM: CENTRAL INTELLIGENCE AGENCY DATA TERMINAL</p>
    <p>TYPE 'HELP' FOR COMMANDS OR 'COMPILER' TO ENTER C++ EXECUTION MODE.</p>
  </div>

  <div id="output"></div>

  <div class="input-line" id="prompt-container">
    <span class="prompt" id="prompt-label">CIA&gt;</span>
    <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
    <button id="submit-btn" class="btn">EXECUTE</button>
  </div>

  <script>
    const input = document.getElementById('command-input');
    const output = document.getElementById('output');
    const submitBtn = document.getElementById('submit-btn');

    // Run command on Enter key
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.keyCode === 13) {
        e.preventDefault();
        processCommand();
      }
    });

    // Run command on Execute button click
    submitBtn.addEventListener('click', function() {
      processCommand();
    });

    function processCommand() {
      const cmd = input.value.trim();
      if (cmd === '') return;
      
      printLine(`CIA> ${cmd}`);
      input.value = '';
      handleTerminalCommand(cmd.toLowerCase());
      input.focus();
    }

    function handleTerminalCommand(cmd) {
      switch(cmd) {
        case 'help':
          printLine("  COMPILER - Launch live C++ code editor & runner");
          printLine("  WHOAMI   - Display current active agent session");
          printLine("  CLEAR    - Clear terminal screen output");
          break;
        case 'whoami':
          printLine("  AGENT: Alex Mason | STATUS: ACTIVE");
          break;
        case 'clear':
          output.innerHTML = '';
          break;
        case 'compiler':
          launchCompilerUI();
          break;
        default:
          printLine(`  Unknown command: '${cmd}'. Type 'HELP' for commands.`);
      }
      window.scrollTo(0, document.body.scrollHeight);
    }

    function launchCompilerUI() {
      printLine("  [SYSTEM]: Initializing C++ Engine...");
      printLine("  [SYSTEM]: Edit C++ code below and click [ RUN EXECUTE ]:");

      const editorDiv = document.createElement('div');
      editorDiv.style.margin = "10px 0";
      editorDiv.innerHTML = `
        <textarea id="cpp-code">#include <iostream>
using namespace std;

int main() {
    cout << "The numbers, Mason! What do they mean?!" << endl;
    return 0;
}</textarea>
        <button id="run-btn" class="btn" style="margin-top:8px;">[ RUN EXECUTE ]</button>
      `;
      output.appendChild(editorDiv);

      document.getElementById('run-btn').addEventListener('click', runCppCode);
    }

    function runCppCode() {
      const code = document.getElementById('cpp-code').value;
      printLine("\n--- COMPILING & EXECUTING ---");

      try {
        let outputText = "";
        const lines = code.split('\n');

        lines.forEach(line => {
          if (line.includes('cout <<')) {
            const match = line.match(/cout\s*<<\s*"([^"]+)"/);
            if (match && match[1]) {
              outputText += match[1] + "\n";
            }
          }
        });

        if (outputText.length === 0) {
          outputText = "[Program executed successfully with no output]";
        }

        printLine(outputText);
        printLine("--- PROCESS FINISHED (EXIT CODE: 0) ---\n");
      } catch (err) {
        printLine(`[COMPILE ERROR]: ${err.message}`);
      }
      window.scrollTo(0, document.body.scrollHeight);
    }

    function printLine(text) {
      const line = document.createElement('div');
      line.className = 'output-line';
      line.textContent = text;
      output.appendChild(line);
    }
  </script>
</body>
</html>
