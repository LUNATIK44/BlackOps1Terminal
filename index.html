<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GKN OPERATING SYSTEM - TERMINAL</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    /* Black Ops CRT Theme Setup */
    :root {
      --crt-green: #00ff66;
      --crt-bg: #050b05;
      --crt-dim: #009933;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--crt-bg);
      color: var(--crt-green);
      font-family: 'VT323', monospace;
      font-size: 1.4rem;
      padding: 2rem;
      text-shadow: 0 0 5px rgba(0, 255, 102, 0.7);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Scanline overlay effect */
    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
    }

    .terminal-header {
      margin-bottom: 1.5rem;
      border-bottom: 2px solid var(--crt-green);
      padding-bottom: 0.5rem;
    }

    .output-line {
      margin-bottom: 0.3rem;
      white-space: pre-wrap;
    }

    .input-line {
      display: flex;
      align-items: center;
      margin-top: 1rem;
    }

    .prompt {
      margin-right: 0.5rem;
    }

    input[type="text"], textarea {
      background: transparent;
      border: none;
      color: var(--crt-green);
      font-family: 'VT323', monospace;
      font-size: 1.4rem;
      outline: none;
      flex-grow: 1;
      text-shadow: 0 0 5px rgba(0, 255, 102, 0.7);
    }

    textarea {
      width: 100%;
      height: 220px;
      border: 1px dashed var(--crt-green);
      padding: 10px;
      margin-top: 10px;
      resize: vertical;
    }

    .btn {
      background: var(--crt-green);
      color: #050b05;
      font-family: 'VT323', monospace;
      font-size: 1.3rem;
      font-weight: bold;
      padding: 6px 16px;
      border: none;
      cursor: pointer;
      margin-top: 10px;
      text-shadow: none;
    }

    .btn:hover {
      background: #ffffff;
    }
  </style>

  <!--  unpkg.com -->
  <<script src="https://cdn.jsdelivr.net/npm/jscpp@2.0.7/dist/JSCPP.es5.min.js"></script>
</head>
<body>

  <div class="terminal-header">
    <p>LOGON: MASON, A.</p>
    <p>SYSTEM: CENTRAL INTELLIGENCE AGENCY DATA TERMINAL</p>
    <p>TYPE 'HELP' FOR COMMANDS OR 'COMPILER' TO ENTER C++ EXECUTION MODE.</p>
  </div>

  <div id="output"></div>

  <div class="input-line" id="prompt-container">
    <span class="prompt" id="prompt-label">CIA&gt;</span>
    <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
  </div>

  <script>
    const input = document.getElementById('command-input');
    const output = document.getElementById('output');
    const promptLabel = document.getElementById('prompt-label');

    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const cmd = input.value.trim();
        printLine(`CIA> ${cmd}`);
        input.value = '';
        handleTerminalCommand(cmd.toLowerCase());
      }
    });

    function handleTerminalCommand(cmd) {
      switch(cmd) {
        case 'help':
          printLine("  COMPILER - Launch live C++ code editor & runner");
          printLine("  WHOAMI   - Display current active agent session");
          printLine("  CLEAR    - Clear terminal screen output");
          break;
        case 'whoami':
          printLine("  AGENT: Alex Mason | STATUS: ACTIVE");
          break;
        case 'clear':
          output.innerHTML = '';
          break;
        case 'compiler':
          launchCompilerUI();
          break;
        default:
          if (cmd !== '') {
            printLine(`  Unknown command: '${cmd}'. Type 'HELP' for commands.`);
          }
      }
      window.scrollTo(0, document.body.scrollHeight);
    }

    function launchCompilerUI() {
      printLine("  [SYSTEM]: Initializing C++ Engine...");
      printLine("  [SYSTEM]: Edit C++ code below and click [ RUN EXECUTE ]:");

      const editorDiv = document.createElement('div');
      editorDiv.innerHTML = `
        <textarea id="cpp-code">#include <iostream>
using namespace std;

int main() {
    cout << "Welcome to Mason's Terminal Compiler!" << endl;
    return 0;
}</textarea>
        <button id="run-btn" class="btn">[ RUN EXECUTE ]</button>
      `;
      output.appendChild(editorDiv);

      document.getElementById('run-btn').addEventListener('click', runCppCode);
    }

    function runCppCode() {
      const code = document.getElementById('cpp-code').value;
      printLine("\n--- COMPILING & EXECUTING ---");

      let outputBuffer = "";
      const config = {
        stdio: {
          write: function(str) {
            outputBuffer += str;
          }
        }
      };

      try {
        if (typeof JSCPP === 'undefined') {
          throw new Error("JSCPP library failed to load from CDN. Check your connection.");
        }
        const exitCode = JSCPP.run(code, "", config);
        printLine(outputBuffer || "[Program executed with no output]");
        printLine(`--- PROCESS FINISHED (EXIT CODE: ${exitCode}) ---\n`);
      } catch (err) {
        printLine(`[COMPILE/RUNTIME ERROR]: ${err.message}`);
      }
      window.scrollTo(0, document.body.scrollHeight);
    }

    function printLine(text) {
      const line = document.createElement('div');
      line.className = 'output-line';
      line.textContent = text;
      output.appendChild(line);
    }
  </script>
</body>
</html>
