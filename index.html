<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GKN OPERATING SYSTEM - TERMINAL</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    /* Black Ops CRT Theme */
    :root {
      --crt-green: #00ff66;
      --crt-bg: #050b05;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--crt-bg);
      color: var(--crt-green);
      font-family: 'VT323', monospace;
      font-size: 1.4rem;
      padding: 2rem;
      text-shadow: 0 0 5px rgba(0, 255, 102, 0.7);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Scanline overlay effect */
    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      z-index: 10;
      pointer-events: none;
    }

    .terminal-header {
      margin-bottom: 1.5rem;
      border-bottom: 2px solid var(--crt-green);
      padding-bottom: 0.5rem;
    }

    .output-line {
      margin-bottom: 0.3rem;
      white-space: pre-wrap;
    }

    .input-line {
      display: flex;
      align-items: center;
      margin-top: 1rem;
    }

    .prompt {
      margin-right: 0.5rem;
    }

    input[type="text"] {
      background: transparent;
      border: none;
      color: var(--crt-green);
      font-family: 'VT323', monospace;
      font-size: 1.4rem;
      outline: none;
      flex-grow: 1;
      text-shadow: 0 0 5px rgba(0, 255, 102, 0.7);
    }
  </style>
</head>
<body>

  <div class="terminal-header">
    <p>LOGON: MASON, A.</p>
    <p>SYSTEM: CENTRAL INTELLIGENCE AGENCY DATA TERMINAL</p>
    <p>TYPE 'HELP' FOR AVAILABLE COMMANDS.</p>
  </div>

  <div id="output"></div>

  <div class="input-line">
    <span class="prompt">CIA&gt;</span>
    <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
  </div>

  <script>
    const input = document.getElementById('command-input');
    const output = document.getElementById('output');

    // Simple Command Processing
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const cmd = input.value.trim().toLowerCase();
        printLine(`CIA> ${input.value}`);
        input.value = '';

        switch(cmd) {
          case 'help':
            printLine("  CAT    - Read system files");
            printLine("  WHOAMI - Display current agent session");
            printLine("  CLEAR  - Clear terminal display");
            printLine("  RUN    - Run interactive tool");
            break;
          case 'whoami':
            printLine("  AGENT: Alex Mason | STATUS: ACTIVE");
            break;
          case 'clear':
            output.innerHTML = '';
            break;
          case 'cat info.txt':
            printLine("  Project Terminal: Built and hosted via GitHub Pages.");
            break;
          default:
            if(cmd !== '') {
              printLine(`  Unknown command: '${cmd}'. Type 'HELP' for commands.`);
            }
        }
        window.scrollTo(0, document.body.scrollHeight);
      }
    });

    function printLine(text) {
      const line = document.createElement('div');
      line.className = 'output-line';
      line.textContent = text;
      output.appendChild(line);
    }
  </script>
</body>
</html>
